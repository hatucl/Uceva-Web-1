<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>Displauy</h2>

    <div class="bloque">Div 1 (block)</div>
    <div class="bloque">Div 2 (block)</div>
    <div class="bloque oculto">Div 3 (none)</div>

    <br>

    <span class="enlinea">Span 1 (inline)</span>
    <span class="enlinea">Span 2 (inline)</span>
    <span class="bloque-enlinea">Span 3 (inline-block)</span>

    <!-- 
      EXPLICACIÓN DE RESULTADOS:
      -block: Ocupa todo el ancho disponible y fuerza un salto de línea.
      - inline: Solo ocua el ancho de su contenido y no respeta width ni height.
      - inline-block: Se alinea en la msma línea pero permite definir width y height.
      - none: Oculta completamente el elemento del fluj del documento.
    -->
</body>
</html>
